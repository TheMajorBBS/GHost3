name: Build on Push
on:
  push:
    branches:
      - '**'  
  pull_request:
    branches: 
      - '**'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x    
    - name: Build
      run: dotnet build GHost3.sln -c Release
